# ============================================================================
# 链接已编译分片 (官方 link job, 用编译任务的中间 DLC 产物)
#
# 用法: 打开每个分片编译任务的详情页, 在 Intermediate Assets ->
#   Intermediate Models 里找 job_xxx_dlc 那一行, 复制后面的模型 ID
#   (mn 开头), 按 part1~4(8) 顺序填入。
#
# 产物 artifact:
#   {component}_linked/      完整包 (stub .onnx + 链接后的 .bin)
#   {component}_linked_stub  仅 stub (几 KB)
# ============================================================================

name: Link compiled parts

on:
  workflow_dispatch:
    inputs:
      m1:
        description: "part1 的 DLC 模型 ID (mn开头, 续跑时留空)"
        required: false
        default: ""
      m2:
        description: "part2 的 DLC 模型 ID (续跑时留空)"
        required: false
        default: ""
      m3:
        description: "part3 的 DLC 模型 ID (续跑时留空)"
        required: false
        default: ""
      m4:
        description: "part4 的 DLC 模型 ID (续跑时留空)"
        required: false
        default: ""
      m5:
        description: "part5 (8片时填, 4片留空)"
        required: false
        default: ""
      m6:
        description: "part6 (可选)"
        required: false
        default: ""
      m7:
        description: "part7 (可选)"
        required: false
        default: ""
      m8:
        description: "part8 (可选)"
        required: false
        default: ""
      component:
        description: "部件名 encoder/decoder"
        required: true
        default: encoder
      device_name:
        description: "AI Hub 设备名 (family 名)"
        required: true
        default: "Samsung Galaxy S26 (Family)"
      existing_wrap_job:
        description: "续跑: 已提交的链接任务 ID (填了就跳过提交直接等它并下载 bin)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "qai-hub"

      - name: 配置 AI Hub API token
        run: |
          qai-hub configure --api_token "${{ secrets.QAI_HUB_API_TOKEN }}" || {
            mkdir -p ~/.qai_hub
            printf '[default]\napi_token=%s\n' "${{ secrets.QAI_HUB_API_TOKEN }}" > ~/.qai_hub/client.ini
          }

      - name: 提交链接任务, 等待, 包装, 下载
        env:
          DEV: ${{ inputs.device_name }}
          COMP: ${{ inputs.component }}
        run: |
          python - <<'PYEOF'
          import os, qai_hub as hub

          dev = os.environ["DEV"]
          comp = os.environ["COMP"]
          resume = "${{ inputs.existing_wrap_job }}".strip()

          if resume:
              link = hub.get_job(resume)
              print(f"续跑模式: 直接等链接任务 {resume}")
              print("链接状态:", link.wait())
              ctx = link.get_target_model()
              assert ctx, "链接失败"
              os.makedirs("final", exist_ok=True)
              ctx.download(f"final/{comp}_linked.bin")
              print("多图 bin 下载完成: %.1f MB" % (os.path.getsize(f"final/{comp}_linked.bin")/1e6))
              raise SystemExit(0)

          mids = [m for m in ["${{ inputs.m1 }}", "${{ inputs.m2 }}",
                              "${{ inputs.m3 }}", "${{ inputs.m4 }}",
                              "${{ inputs.m5 }}", "${{ inputs.m6 }}",
                              "${{ inputs.m7 }}", "${{ inputs.m8 }}"] if m.strip()]
          print(f"共 {len(mids)} 个 DLC 模型")
          assert mids, "没填续跑任务 ID, 也没填任何 DLC 模型 ID, 至少填一样"

          models = []
          for i, mid in enumerate(mids, 1):
              mdl = hub.get_model(mid)
              print(f"part{i}: {mid} -> {mdl.name}")
              models.append(mdl)

          device = hub.Device(dev)
          try:
              link = hub.submit_link_job(models=models, device=device,
                                         name=f"w8a16-{comp}-linked")
          except TypeError:
              link = hub.submit_link_job(models=models,
                                         name=f"w8a16-{comp}-linked")
          print("链接任务已提交:", link.job_id)
          print("链接状态:", link.wait())
          ctx = link.get_target_model()
          assert ctx, "链接失败, 去 AI Hub 看 job"
          # 多图 context bin 不能被 AI Hub 包装, 直接下载 bin, stub 自己造
          os.makedirs("final", exist_ok=True)
          ctx.download(f"final/{comp}_linked.bin")
          print("多图 bin 下载完成: %.1f MB" % (os.path.getsize(f"final/{comp}_linked.bin")/1e6))
          PYEOF
          ls -la final/

      - name: 侦察 bin 内的图名/张量名 (给造 stub 用)
        run: |
          BIN=$(ls final/*.bin | head -1)
          echo "===== bin 大小 ====="
          ls -la "$BIN"
          echo "===== 图名候选 (含 dlc/w8a16/part 字样, 无斜杠, 按次数排) ====="
          strings "$BIN" | grep -iE "dlc|w8a16|_p[0-9]|part|graph" | grep -v "/" | sort | uniq -c | sort -rn | head -40
          echo "===== 顶层 IO 名候选 (无斜杠的 input/output/cache/features/logits 等) ====="
          strings "$BIN" | grep -v "/" | grep -iE "^[a-z_0-9]*(input|output|cache|features|logits|token|position|kv)" | sort | uniq -c | sort -rn | head -60
          echo "===== 重复出现 4 次左右的短名 (图名通常每图一份) ====="
          strings "$BIN" | grep -v "/" | awk 'length($0)>=4 && length($0)<=40' | sort | uniq -c | awk '$1>=3 && $1<=6' | sort -rn | head -40

      - name: 上传链接产物 (多图 bin)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component }}_linked_bin
          path: final/
          retention-days: 14
