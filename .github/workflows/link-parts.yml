# ============================================================================
# 链接已编译分片 (官方 link job, 用编译任务的中间 DLC 产物)
#
# 用法: 打开每个分片编译任务的详情页, 在 Intermediate Assets ->
#   Intermediate Models 里找 job_xxx_dlc 那一行, 复制后面的模型 ID
#   (mn 开头), 按 part1~4(8) 顺序填入。
#
# 产物 artifact:
#   {component}_linked/      完整包 (stub .onnx + 链接后的 .bin)
#   {component}_linked_stub  仅 stub (几 KB)
# ============================================================================

name: Link compiled parts

on:
  workflow_dispatch:
    inputs:
      m1:
        description: "part1 的 DLC 模型 ID (mn开头)"
        required: true
      m2:
        description: "part2 的 DLC 模型 ID"
        required: true
      m3:
        description: "part3 的 DLC 模型 ID"
        required: true
      m4:
        description: "part4 的 DLC 模型 ID"
        required: true
      m5:
        description: "part5 (8片时填, 4片留空)"
        required: false
        default: ""
      m6:
        description: "part6 (可选)"
        required: false
        default: ""
      m7:
        description: "part7 (可选)"
        required: false
        default: ""
      m8:
        description: "part8 (可选)"
        required: false
        default: ""
      component:
        description: "部件名 encoder/decoder"
        required: true
        default: encoder
      device_name:
        description: "AI Hub 设备名 (family 名)"
        required: true
        default: "Samsung Galaxy S26 (Family)"

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "qai-hub"

      - name: 配置 AI Hub API token
        run: |
          qai-hub configure --api_token "${{ secrets.QAI_HUB_API_TOKEN }}" || {
            mkdir -p ~/.qai_hub
            printf '[default]\napi_token=%s\n' "${{ secrets.QAI_HUB_API_TOKEN }}" > ~/.qai_hub/client.ini
          }

      - name: 提交链接任务, 等待, 包装, 下载
        env:
          DEV: ${{ inputs.device_name }}
          COMP: ${{ inputs.component }}
        run: |
          python - <<'PYEOF'
          import os, qai_hub as hub

          dev = os.environ["DEV"]
          comp = os.environ["COMP"]
          mids = [m for m in ["${{ inputs.m1 }}", "${{ inputs.m2 }}",
                              "${{ inputs.m3 }}", "${{ inputs.m4 }}",
                              "${{ inputs.m5 }}", "${{ inputs.m6 }}",
                              "${{ inputs.m7 }}", "${{ inputs.m8 }}"] if m.strip()]
          print(f"共 {len(mids)} 个 DLC 模型")

          models = []
          for i, mid in enumerate(mids, 1):
              mdl = hub.get_model(mid)
              print(f"part{i}: {mid} -> {mdl.name}")
              models.append(mdl)

          device = hub.Device(dev)
          try:
              link = hub.submit_link_job(models=models, device=device,
                                         name=f"w8a16-{comp}-linked")
          except TypeError:
              link = hub.submit_link_job(models=models,
                                         name=f"w8a16-{comp}-linked")
          print("链接任务已提交:", link.job_id)
          print("链接状态:", link.wait())
          ctx = link.get_target_model()
          assert ctx, "链接失败, 去 AI Hub 看 job"

          # 包装成 precompiled onnx (stub .onnx + .bin): 不传 options
          wrap = hub.submit_compile_job(model=ctx, device=device,
                                        name=f"w8a16-{comp}-linked-wrap")
          print("包装任务已提交:", wrap.job_id)
          print("包装状态:", wrap.wait())
          tm = wrap.get_target_model()
          assert tm, "包装失败"
          os.makedirs("final", exist_ok=True)
          tm.download(f"final/{comp}_linked.zip")
          print("下载完成")
          PYEOF
          python - <<'PYEOF'
          import glob, os, zipfile
          cand = sorted(glob.glob("final/*.zip*"), key=os.path.getmtime)
          with zipfile.ZipFile(cand[-1]) as z:
              z.extractall("final/pkg")
          for f in glob.glob("final/pkg/**/*", recursive=True):
              if os.path.isfile(f):
                  print(f, "%.2f MB" % (os.path.getsize(f)/1e6))
          PYEOF

      - name: 上传完整包
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component }}_linked
          path: final/pkg/
          retention-days: 14

      - name: 单独上传 stub
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component }}_linked_stub
          path: final/pkg/*.onnx
          retention-days: 14
