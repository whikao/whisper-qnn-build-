# ============================================================================
# 链接已编译分片 (官方 link job, 用编译任务的中间 DLC 产物)
#
# 用法: 打开每个分片编译任务的详情页, 在 Intermediate Assets ->
#   Intermediate Models 里找 job_xxx_dlc 那一行, 复制后面的模型 ID
#   (mn 开头), 按 part1~4(8) 顺序填入。
#
# 产物 artifact {component}_linked_final:
#   {component}_linked.bin   链接后的多图 context binary
#   {component}.onnx         官方 EPContext 规格的多图 stub (串链, 输出 output_0..N)
# ============================================================================

name: Link compiled parts

on:
  workflow_dispatch:
    inputs:
      m1:
        description: "part1 的 DLC 模型 ID (mn开头, 续跑时留空)"
        required: false
        default: ""
      m2:
        description: "part2 的 DLC 模型 ID (续跑时留空)"
        required: false
        default: ""
      m3:
        description: "part3 的 DLC 模型 ID (续跑时留空)"
        required: false
        default: ""
      m4:
        description: "part4 的 DLC 模型 ID (续跑时留空)"
        required: false
        default: ""
      m5:
        description: "part5 (8片时填, 4片留空)"
        required: false
        default: ""
      m6:
        description: "part6 (可选)"
        required: false
        default: ""
      m7:
        description: "part7 (可选)"
        required: false
        default: ""
      m8:
        description: "part8 (可选)"
        required: false
        default: ""
      component:
        description: "部件名 encoder/decoder"
        required: true
        default: encoder
      device_name:
        description: "AI Hub 设备名 (family 名)"
        required: true
        default: "Samsung Galaxy S26 (Family)"
      existing_wrap_job:
        description: "续跑: 已提交的链接任务 ID (填了就跳过提交直接等它并下载 bin)"
        required: false
        default: ""
      src_job:
        description: "AI Hub 量化(QDQ)任务 ID, 和切片编译时下载的完整模型同源 (j开头, 如 jgd2neme5), 给 stub 提供 shape"
        required: true
      part_jobs:
        description: "多bin模式: 4个分片编译任务ID(j开头,逗号分隔,顺序随意)。填了就跳过链接,直接下单图bin做多bin stub"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "qai-hub" "onnx"

      - name: 配置 AI Hub API token
        run: |
          qai-hub configure --api_token "${{ secrets.QAI_HUB_API_TOKEN }}" || {
            mkdir -p ~/.qai_hub
            printf '[default]\napi_token=%s\n' "${{ secrets.QAI_HUB_API_TOKEN }}" > ~/.qai_hub/client.ini
          }

      - name: 提交链接任务, 等待, 包装, 下载
        env:
          DEV: ${{ inputs.device_name }}
          COMP: ${{ inputs.component }}
        run: |
          python - <<'PYEOF'
          import os, qai_hub as hub

          dev = os.environ["DEV"]
          comp = os.environ["COMP"]
          resume = "${{ inputs.existing_wrap_job }}".strip()

          part_jobs = [j.strip() for j in "${{ inputs.part_jobs }}".split(",") if j.strip()]
          if part_jobs:
              import zipfile, glob
              os.makedirs("final", exist_ok=True)
              for i, jid in enumerate(part_jobs, 1):
                  mdl = hub.get_job(jid).get_target_model()
                  assert mdl, f"分片任务 {jid} 没有产物"
                  mdl.download(f"final/raw{i}.zip")
                  dl = glob.glob(f"final/raw{i}*")[0]   # download 会自行加后缀
                  if zipfile.is_zipfile(dl):
                      with zipfile.ZipFile(dl) as z:
                          names = z.namelist()
                          print(f"part{i}: {jid} zip 内容: {names}")
                          z.extractall(f"final/raw{i}")
                      os.remove(dl)
                      bins = glob.glob(f"final/raw{i}/**/*.bin", recursive=True)
                      assert bins, f"part{i} 的 zip 里没找到 bin"
                      os.rename(bins[0], f"final/{comp}_raw{i}.bin")
                      # 官方单图 stub 也留着, 供对照
                      ons = glob.glob(f"final/raw{i}/**/*.onnx", recursive=True)
                      if ons:
                          os.rename(ons[0], f"final/{comp}_raw{i}_official.onnx")
                  else:
                      os.rename(dl, f"final/{comp}_raw{i}.bin")
                  print(f"part{i}: {jid} -> %.1f MB" % (os.path.getsize(f"final/{comp}_raw{i}.bin")/1e6))
              raise SystemExit(0)

          if resume:
              link = hub.get_job(resume)
              print(f"续跑模式: 直接等链接任务 {resume}")
              print("链接状态:", link.wait())
              ctx = link.get_target_model()
              assert ctx, "链接失败"
              os.makedirs("final", exist_ok=True)
              ctx.download(f"final/{comp}_linked.bin")
              print("多图 bin 下载完成: %.1f MB" % (os.path.getsize(f"final/{comp}_linked.bin")/1e6))
              raise SystemExit(0)

          mids = [m for m in ["${{ inputs.m1 }}", "${{ inputs.m2 }}",
                              "${{ inputs.m3 }}", "${{ inputs.m4 }}",
                              "${{ inputs.m5 }}", "${{ inputs.m6 }}",
                              "${{ inputs.m7 }}", "${{ inputs.m8 }}"] if m.strip()]
          print(f"共 {len(mids)} 个 DLC 模型")
          assert mids, "没填续跑任务 ID, 也没填任何 DLC 模型 ID, 至少填一样"

          models = []
          for i, mid in enumerate(mids, 1):
              mdl = hub.get_model(mid)
              print(f"part{i}: {mid} -> {mdl.name}")
              models.append(mdl)

          device = hub.Device(dev)
          try:
              link = hub.submit_link_job(models=models, device=device,
                                         name=f"w8a16-{comp}-linked")
          except TypeError:
              link = hub.submit_link_job(models=models,
                                         name=f"w8a16-{comp}-linked")
          print("链接任务已提交:", link.job_id)
          print("链接状态:", link.wait())
          ctx = link.get_target_model()
          assert ctx, "链接失败, 去 AI Hub 看 job"
          # 多图 context bin 不能被 AI Hub 包装, 直接下载 bin, stub 自己造
          os.makedirs("final", exist_ok=True)
          ctx.download(f"final/{comp}_linked.bin")
          print("多图 bin 下载完成: %.1f MB" % (os.path.getsize(f"final/{comp}_linked.bin")/1e6))
          PYEOF
          ls -la final/

      - name: 侦察 bin 内的图名/张量名 (给造 stub 用)
        run: |
          BIN=$(ls final/*.bin | head -1)
          ls -la "$BIN"
          python - <<'PYEOF'
          import re, glob
          data = open(glob.glob("final/*.bin")[0], "rb").read(65536)  # 只读头部64KB
          pat = re.compile(rb"[ -~]{3,80}")
          print("===== 头部 64KB 可读字符串 (按出现顺序) =====")
          n = 0
          for m in pat.finditer(data):
              s = m.group().decode()
              # 保留: 含字母的标识符样字符串; 丢弃纯乱码
              if not re.search(r"[A-Za-z]", s): continue
              alnum = sum(c.isalnum() or c in "_/.-" for c in s)
              if alnum / len(s) < 0.85: continue   # 乱码率高的丢弃
              print(f"{n:4d} @{m.start():6d}  {s}")
              n += 1
              if n > 500: break
          PYEOF

      - name: 生成多图 stub onnx (按 onnxruntime 官方 EPContext 规则)
        env:
          SRCJOB: ${{ inputs.src_job }}
          COMP: ${{ inputs.component }}
        run: |
          python - <<'PYEOF'
          import re, glob, os, zipfile, onnx, qai_hub as hub
          from onnx import helper, TensorProto

          comp = os.environ["COMP"]

          # ---- 0. 从 AI Hub 下载完整 QDQ 模型 (提供 shape) ----
          os.makedirs("orig", exist_ok=True)
          src_job = os.environ["SRCJOB"].strip()
          mdl = hub.get_job(src_job).get_target_model()
          assert mdl, f"量化任务 {src_job} 没有产物模型"
          mdl.download("orig/qdq_model.zip")
          dl = glob.glob("orig/qdq_model*")[0]   # download 会自行加后缀
          print("下载落盘:", dl)
          if zipfile.is_zipfile(dl):
              with zipfile.ZipFile(dl) as z:
                  z.extractall("orig")
          else:
              os.rename(dl, "orig/model.onnx")
          src_path = glob.glob("orig/**/*.onnx", recursive=True)[0]
          print("完整 QDQ 模型:", src_path)

          bin_paths = sorted(glob.glob("final/*.bin"))
          bin_name = os.path.basename(bin_paths[0])

          # ---- 1. 解析 bin 头部: 每张图的 图名 + IO 名 + 所属 bin ----
          # 图名 = graph_xxx, 且其区域内至少有一个 output_N (排除 graph_prune 等假名)
          pat = re.compile(rb"[ -~]{4,80}")
          graphs = []   # [(graph_name, [io names], bin_file)]
          for bp in bin_paths:
              head = open(bp, "rb").read(4 * 1024 * 1024)   # 头部 4MB 足够装元信息
              strs = [(m.start(), m.group().decode()) for m in pat.finditer(head)]
              cand = [(off, s) for off, s in strs if re.fullmatch(r"graph_[A-Za-z0-9_]{6,14}", s)]
              for gi, (off, gname) in enumerate(cand):
                  end = cand[gi + 1][0] if gi + 1 < len(cand) else off + 30000
                  io = [s for o, s in strs
                        if off < o < end and re.fullmatch(r"[A-Za-z_][A-Za-z0-9_.]{2,60}", s)]
                  if any(re.fullmatch(r"output_\d+", s) for s in io):
                      graphs.append((gname, [s for s in io if s != gname], os.path.basename(bp)))
          assert len(graphs) >= 1, f"一张图都没解析到, 检查 bin"
          print(f"从 {len(bin_paths)} 个 bin 解析到 {len(graphs)} 张图:")
          for gn, io, bf in graphs:
              print(f"  {gn} ({bf}): {len(io)} 个 IO -> {io[:6]}{'...' if len(io)>6 else ''}")

          # ---- 2. 输入/输出划分 (输入名必须能在原始模型里找到, 过滤乱码) ----
          src = onnx.load(src_path, load_external_data=False)
          if len(src.graph.value_info) < 100:
              print("原始模型缺 value_info, 跑 shape inference 补齐...")
              src = onnx.shape_inference.infer_shapes(src)
          g = src.graph
          print(f"原始模型 value_info {len(g.value_info)} 条")
          # 名字归一化: bin 名 = 原始名斜杠直接换下划线 (前导斜杠变前导下划线)
          def norm(n):
              return n.replace("/", "_")
          src_names = set()
          for vi in list(g.input) + list(g.output) + list(g.value_info):
              src_names.add(vi.name)
              src_names.add(norm(vi.name))
          src_in_names = {vi.name for vi in g.input} | {norm(vi.name) for vi in g.input}
          def is_src(n):
              b = n.replace("_updated", "")
              return (n in src_names or b in src_names or norm(b) in src_names
                      or norm(n) in src_names)
          ginfo = []
          for gn, io, bf in graphs:
              outs = sorted({s for s in io if re.fullmatch(r"output_\d+", s)},
                            key=lambda s: int(s.split("_")[1]))
              ins = []
              for s in io:
                  if s in outs or not is_src(s):
                      continue
                  if s not in ins:
                      ins.append(s)
              ginfo.append((gn, ins, outs, bf))
          for gn, ins, outs, bf in ginfo:
              print(f"  {gn} [{bf}]: 输入{len(ins)} {ins[:4]}{'...' if len(ins)>4 else ''} 输出{len(outs)}")

          # ---- 3. shape 表 ----
          tab = {}
          for vi in list(g.input) + list(g.output) + list(g.value_info):
              tab[vi.name] = vi
              tab.setdefault(norm(vi.name), vi)
          def shape_of(name):
              b = name.replace("_updated", "")
              vi = tab.get(name) or tab.get(b) or tab.get(norm(b))
              assert vi is not None, f"原始模型里找不到 {name} 的 shape"
              t = vi.type.tensor_type
              dims = [d.dim_value for d in t.shape.dim]
              assert all(d > 0 for d in dims), f"{name} 含动态维度 {dims}"
              return t.elem_type, dims

          # ---- 4. 串联: 首图=所有输入都是模型级输入; 其余按切面名的层号升序 ----
          def cut_names(i):
              return [s for s in ginfo[i][1] if s not in src_in_names]
          first = None
          for i in range(len(ginfo)):
              if ginfo[i][1] and not cut_names(i):
                  first = i; break
          assert first is not None, "找不到首图 (所有输入都是模型级输入的图)"
          def layerno(i):
              m = re.search(r"_(\d+)_", cut_names(i)[0])
              return int(m.group(1)) if m else 0
          rest = [i for i in range(len(ginfo)) if i != first]
          rest.sort(key=layerno)
          order = [first] + rest
          print("串联顺序:", " -> ".join(ginfo[i][0] for i in order))

          # ---- 5. 造节点: 输入用 bin 里的原名; 中间图的唯一输出改成下一图的切面输入名 ----
          multi_bin = len(bin_paths) > 1
          nodes, value_infos, graph_inputs, graph_outputs = [], [], [], []
          for pos, gi in enumerate(order):
              gn, ins, outs, bf = ginfo[gi]
              is_last = (pos == len(order) - 1)
              node_in_names = ins
              if is_last:
                  node_out_names = outs   # 末图保留 output_N (中间图的 output_N 已全部改掉, 不撞名)
              else:
                  nxt_cut = cut_names(order[pos + 1])
                  assert len(nxt_cut) == 1, "中间图的下一图应有唯一切面输入"
                  # 中间图: 第1个输出=切面(改名接通下一图), 其余=cache(用原始模型输出名唯一化)
                  n_cache = len(outs) - 1
                  base = len(graph_outputs)   # 已确定的图输出数 = 本图 cache 在原始输出里的起始位
                  cache_src = []
                  for j in range(n_cache):
                      oi = base + j
                      assert oi < len(g.output), "cache 数超出原始模型输出数"
                      cache_src.append(g.output[oi])
                  node_out_names = [nxt_cut[0]] + [sv.name for sv in cache_src]
              if multi_bin:
                  # 多 bin 模式: 每个节点都是 main, 各指各的单图 bin (文件名按链位统一为 {comp}_p{N}.bin)
                  bin_ref = f"{comp}_p{pos + 1}.bin"
                  attrs = dict(name=gn, domain="com.microsoft",
                               source="QnnExecutionProvider",
                               partition_name=gn,
                               main_context=1,
                               ep_cache_context=bin_ref, embed_mode=0)
              else:
                  attrs = dict(name=gn, domain="com.microsoft",
                               source="QnnExecutionProvider",
                               partition_name=gn,
                               main_context=1 if pos == 0 else 0)
                  if pos == 0:
                      attrs.update(ep_cache_context=bin_name, embed_mode=0)
              node = helper.make_node("EPContext", node_in_names, node_out_names, **attrs)
              nodes.append(node)
              # shape 声明
              for nm in node_in_names:
                  et, dims = shape_of(nm)
                  vi = helper.make_tensor_value_info(nm, et, dims)
                  value_infos.append(vi)
                  if pos == 0:
                      graph_inputs.append(vi)
              for j, nm in enumerate(node_out_names):
                  if is_last:
                      # 末图第 j 个输出对应原始模型第 len(graph_outputs)+j 个输出
                      # (中间图的 cache 已按序占了前面; encoder 无中间 cache 时 j 即序号)
                      sv = g.output[len(graph_outputs)]
                      et = sv.type.tensor_type.elem_type
                      dims = [d.dim_value for d in sv.type.tensor_type.shape.dim]
                  elif j == 0:
                      et, dims = shape_of(nm)   # 切面
                  else:
                      sv = cache_src[j - 1]
                      et = sv.type.tensor_type.elem_type
                      dims = [d.dim_value for d in sv.type.tensor_type.shape.dim]
                  vi = helper.make_tensor_value_info(nm, et, dims)
                  value_infos.append(vi)
                  if is_last or j > 0:
                      graph_outputs.append(vi)   # 中间图 cache + 末图全部输出 = 图级输出 (切面不进)
          assert len(graph_outputs) == len(g.output), \
              f"图输出 {len(graph_outputs)} 个 != 原始模型 {len(g.output)} 个"

          if multi_bin:
              # bin 按链位改名, 与 stub 里的 ep_cache_context 引用一致
              for pos, gi in enumerate(order):
                  bf = ginfo[gi][3]
                  if bf != f"{comp}_p{pos + 1}.bin":
                      os.rename(f"final/{bf}", f"final/{comp}_p{pos + 1}.bin")
                  print(f"链位 p{pos + 1} = {bf} (图 {ginfo[gi][0]})")

          gd = helper.make_graph(nodes, f"{comp}_linked", graph_inputs,
                                 graph_outputs, [], "", value_infos)
          mo = helper.make_model(gd, producer_name="ms",
                                 opset_imports=[helper.make_opsetid("", 18),
                                                helper.make_opsetid("com.microsoft", 1)])
          out = f"final/{comp}.onnx"
          onnx.save(mo, out)
          print("stub 已生成:", out, "%.1f KB" % (os.path.getsize(out) / 1024))
          for nd in nodes:
              print(f"  节点 {nd.name}: in={list(nd.input)} out={len(list(nd.output))}个")
          PYEOF
          ls -la final/

      - name: 上传链接产物 (多图 bin + stub onnx)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component }}_linked_final
          path: final/
          retention-days: 14

      - name: 单独上传 stub onnx (几KB, 已有 bin 时只下这个)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component }}_stub_only
          path: final/${{ inputs.component }}.onnx
          retention-days: 14
