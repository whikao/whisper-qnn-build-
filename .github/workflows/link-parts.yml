# ============================================================================
# 链接已编译分片 (官方 link job, 用编译任务的中间 DLC 产物)
#
# 用法: 打开每个分片编译任务的详情页, 在 Intermediate Assets ->
#   Intermediate Models 里找 job_xxx_dlc 那一行, 复制后面的模型 ID
#   (mn 开头), 按 part1~4(8) 顺序填入。
#
# 产物 artifact:
#   {component}_linked/      完整包 (stub .onnx + 链接后的 .bin)
#   {component}_linked_stub  仅 stub (几 KB)
# ============================================================================

name: Link compiled parts

on:
  workflow_dispatch:
    inputs:
      m1:
        description: "part1 的 DLC 模型 ID (mn开头, 续跑时留空)"
        required: false
        default: ""
      m2:
        description: "part2 的 DLC 模型 ID (续跑时留空)"
        required: false
        default: ""
      m3:
        description: "part3 的 DLC 模型 ID (续跑时留空)"
        required: false
        default: ""
      m4:
        description: "part4 的 DLC 模型 ID (续跑时留空)"
        required: false
        default: ""
      m5:
        description: "part5 (8片时填, 4片留空)"
        required: false
        default: ""
      m6:
        description: "part6 (可选)"
        required: false
        default: ""
      m7:
        description: "part7 (可选)"
        required: false
        default: ""
      m8:
        description: "part8 (可选)"
        required: false
        default: ""
      component:
        description: "部件名 encoder/decoder"
        required: true
        default: encoder
      device_name:
        description: "AI Hub 设备名 (family 名)"
        required: true
        default: "Samsung Galaxy S26 (Family)"
      existing_wrap_job:
        description: "续跑: 已提交的链接任务 ID (填了就跳过提交直接等它并下载 bin)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "qai-hub"

      - name: 配置 AI Hub API token
        run: |
          qai-hub configure --api_token "${{ secrets.QAI_HUB_API_TOKEN }}" || {
            mkdir -p ~/.qai_hub
            printf '[default]\napi_token=%s\n' "${{ secrets.QAI_HUB_API_TOKEN }}" > ~/.qai_hub/client.ini
          }

      - name: 提交链接任务, 等待, 包装, 下载
        env:
          DEV: ${{ inputs.device_name }}
          COMP: ${{ inputs.component }}
        run: |
          python - <<'PYEOF'
          import os, qai_hub as hub

          dev = os.environ["DEV"]
          comp = os.environ["COMP"]
          resume = "${{ inputs.existing_wrap_job }}".strip()

          if resume:
              link = hub.get_job(resume)
              print(f"续跑模式: 直接等链接任务 {resume}")
              print("链接状态:", link.wait())
              ctx = link.get_target_model()
              assert ctx, "链接失败"
              os.makedirs("final", exist_ok=True)
              ctx.download(f"final/{comp}_linked.bin")
              print("多图 bin 下载完成: %.1f MB" % (os.path.getsize(f"final/{comp}_linked.bin")/1e6))
              raise SystemExit(0)

          mids = [m for m in ["${{ inputs.m1 }}", "${{ inputs.m2 }}",
                              "${{ inputs.m3 }}", "${{ inputs.m4 }}",
                              "${{ inputs.m5 }}", "${{ inputs.m6 }}",
                              "${{ inputs.m7 }}", "${{ inputs.m8 }}"] if m.strip()]
          print(f"共 {len(mids)} 个 DLC 模型")
          assert mids, "没填续跑任务 ID, 也没填任何 DLC 模型 ID, 至少填一样"

          models = []
          for i, mid in enumerate(mids, 1):
              mdl = hub.get_model(mid)
              print(f"part{i}: {mid} -> {mdl.name}")
              models.append(mdl)

          device = hub.Device(dev)
          try:
              link = hub.submit_link_job(models=models, device=device,
                                         name=f"w8a16-{comp}-linked")
          except TypeError:
              link = hub.submit_link_job(models=models,
                                         name=f"w8a16-{comp}-linked")
          print("链接任务已提交:", link.job_id)
          print("链接状态:", link.wait())
          ctx = link.get_target_model()
          assert ctx, "链接失败, 去 AI Hub 看 job"
          # 多图 context bin 不能被 AI Hub 包装, 直接下载 bin, stub 自己造
          os.makedirs("final", exist_ok=True)
          ctx.download(f"final/{comp}_linked.bin")
          print("多图 bin 下载完成: %.1f MB" % (os.path.getsize(f"final/{comp}_linked.bin")/1e6))
          PYEOF
          ls -la final/

      - name: 侦察 bin 内的图名/张量名 (给造 stub 用)
        run: |
          BIN=$(ls final/*.bin | head -1)
          ls -la "$BIN"
          python - <<'PYEOF'
          import re, glob
          data = open(glob.glob("final/*.bin")[0], "rb").read()
          print("bin 大小: %.1f MB" % (len(data)/1e6))
          # 1) 找所有 graph_xxxx 图名及其出现位置
          names = {}
          for m in re.finditer(rb"graph_[A-Za-z0-9_]{3,20}", data):
              n = m.group().decode()
              names.setdefault(n, []).append(m.start())
          print("===== 图名及位置 =====")
          for n, offs in sorted(names.items(), key=lambda kv: kv[1][0]):
              print(f"{n}  出现{len(offs)}次  首个位置={offs[0]}")
          gnames = [n for n, offs in sorted(names.items(), key=lambda kv: kv[1][0])]
          # 2) 按图名位置切段: 每张图的区域 = 它的名字首次出现 -> 下一张图名字首次出现
          bounds = [names[n][0] for n in gnames] + [len(data)]
          pat = re.compile(rb"[ -~]{4,60}")
          for i, n in enumerate(gnames):
              seg = data[bounds[i]:bounds[i+1]]
              print(f"===== 图 {i+1}: {n} (区域 {bounds[i]}~{bounds[i+1]}, {len(seg)/1e6:.0f}MB) =====")
              cnt = {}
              for m in pat.finditer(seg):
                  s = m.group().decode()
                  if "/" in s or " " in s or ";" in s: continue   # 节点名/配置串排除
                  if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_.]*", s): continue
                  cnt[s] = cnt.get(s, 0) + 1
              # 图级 IO 名候选: 短且无斜杠
              io_like = {k:v for k,v in cnt.items()
                         if re.fullmatch(r"(input|output|kv|k_cache|v_cache|logits|features|tokens|positions?|encoder.*|_?[a-z]+_[0-9]+.*)", k, re.I)}
              for k in sorted(io_like): print(f"  {io_like[k]:4d}  {k}")
              print(f"  (该段其余无斜杠标识符共 {len(cnt)-len(io_like)} 种, 略)")
          PYEOF

      - name: 上传链接产物 (多图 bin)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component }}_linked_bin
          path: final/
          retention-days: 14
