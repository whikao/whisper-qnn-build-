# ============================================================================
# whisper large-v3 (完整版) -> QNN EPContext 自动转换 (目标: SM8850 / Hexagon v81)
#
# 原理: 官方 qai_hub_models 库里没有 large-v3 完整版, 但 whisper 家族的导出
#  配方是共享的 (层数/头数/维度全部从 HF config 动态读取)。本 workflow 在云
#  runner 上复制 turbo 的配方、把型号改成 openai/whisper-large-v3 完成注册,
#  然后走 AI Hub 云编译, 产物和你现在用的 turbo 预编译包格式完全一致
#  (precompiled_qnn_onnx = EPContext), v9 驱动换 -m 路径直接用。
#
# 使用前提 (一次性准备):
#   1. 去 https://aihub.qualcomm.com 注册账号, 在 Settings -> API 拿 API Token
#   2. 把本文件放到仓库 .github/workflows/ 下
#   3. 仓库 Settings -> Secrets and variables -> Actions -> New repository secret:
#        Name:   QAI_HUB_API_TOKEN
#        Secret: 你的 token
#   4. Actions 页签手动 Run workflow:
#        - 第一次先把 list_devices 打勾跑一遍, 在日志里找 SM8850 对应的设备名
#          (找带 "8 Elite Gen 5" / "Galaxy S26" / "Redmi K90" / "OnePlus 15"
#           字样的), 然后把它填到 device 输入框正式跑
#
# 产物: Artifacts 里下载 xxx.zip / xxx.z01 ... 全部分卷后:
#        7z x xxx.zip        (7z 自动连读分卷)
#   解压后目录结构和你现在的 turbo 包一样, 手机上:
#        ./whisper_qnn xxx.wav -m <解压目录> -t <tokens.txt> --vad ... -o out.srt
#   tokens.txt 继续用 sherpa-onnx whisper-medium 那份 (v2/v3 文本 token 一致)
#
# 预期: float 路径全程约 30~90 分钟, 产物 ~3.1GB fp16;
#       w8a16 路径多了"真实语音校准数据生成"步骤 (runner 上跑十几次 encoder
#       推理), 全程约 2~4 小时, 产物 ~1.55GB
#
# w8a16 量化版 (precision 选 w8a16) —— 全云端量化, runner 不跑 AIMET:
#   1) runner 只导出 float ONNX (encoder + decoder)
#   2) runner 下载 LibriSpeech 真实语音 -> 算 log-mel -> 构造校准数据
#      (encoder 用真实 mel; decoder 用真实 encoder 输出 + 模拟解码步输入)
#   3) submit_quantize_job 把量化和 AIMET 计算都交给高通服务器 (w8a16 =
#      INT8 权重 + INT16 激活), runner 内存占用 < 2GB, 无 OOM 风险
#   4) submit_compile_job 把量化后 QDQ onnx 编成 EPContext
#   注意: 量化用的校准数据是真实语音特征, 不是随机/占位样本, 质量有保障。
#         qai_hub 的 Python API 偶尔改版, 若脚本报属性/参数名错误, 把日志
#         发我, 一般改一行就能适配。
# ============================================================================

name: Convert Whisper to QNN EPContext

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: >-
          模型 ID: whisper_large_v3 = 自注册的完整版; 也可直接填官方库型号
          (whisper_medium / whisper_small / whisper_base / whisper_tiny / whisper_large_v3_turbo)
        default: "whisper_large_v3"
        required: true
      device:
        description: >-
          AI Hub 目标设备名 (决定 Hexagon 架构; SM8850 选 8 Elite Gen 5 系列设备)。
          不确定就先勾选 list_devices 跑一遍查名字
        default: "Samsung Galaxy S26 (Family)"
        required: true
      precision:
        description: >-
          精度: float = fp16 (~3.1GB, 质量好); w8a16 = int8 权重量化 (~1.55GB,
          快约 1.3~1.8x, 全云端量化 + 真实语音校准, 仅支持 whisper_large_v3)
        type: choice
        options:
          - float
          - w8a16
        default: float
      list_devices:
        description: "只列出 AI Hub 可用设备名然后退出 (辅助模式)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 清理磁盘 (large-v3 中间产物很大)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/lib/jvm || true
          docker system prune -af 2>/dev/null || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖 (CPU 版 torch, 避免下载 2GB+ CUDA 包)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install qai-hub qai-hub-models "transformers==4.56.2"

      - name: 安装 w8a16 额外依赖 (校准数据生成用, 不装 AIMET)
        if: ${{ !inputs.list_devices && inputs.precision == 'w8a16' }}
        run: |
          pip install onnxruntime datasets soundfile

      - name: 检查 w8a16 支持的模型
        if: ${{ !inputs.list_devices && inputs.precision == 'w8a16' }}
        run: |
          if [ "${{ inputs.model_id }}" != "whisper_large_v3" ]; then
            echo "::error::w8a16 云端量化路径目前只写了 whisper_large_v3 (自注册); 其他型号请用 float 精度"
            exit 1
          fi

      - name: 配置 AI Hub API token
        run: |
          qai-hub configure --api_token "${{ secrets.QAI_HUB_API_TOKEN }}" || {
            mkdir -p ~/.qai_hub
            printf '[default]\napi_token=%s\n' "${{ secrets.QAI_HUB_API_TOKEN }}" > ~/.qai_hub/client.ini
          }

      - name: 列出 AI Hub 可用设备 (辅助模式)
        if: inputs.list_devices
        run: qai-hub list-devices

      - name: 注册 whisper_large_v3 变体 (复制 turbo 配方, 改 HF 型号)
        if: ${{ !inputs.list_devices && inputs.model_id == 'whisper_large_v3' }}
        run: |
          set -e
          MODELS_DIR=$(python -c "import pathlib, qai_hub_models; print(pathlib.Path(qai_hub_models.__file__).parent / 'models')")
          echo "qai_hub_models 模型目录: $MODELS_DIR"
          cp -r "$MODELS_DIR/whisper_large_v3_turbo" "$MODELS_DIR/whisper_large_v3"
          cd "$MODELS_DIR/whisper_large_v3"
          sed -i 's|openai/whisper-large-v3-turbo|openai/whisper-large-v3|g' model.py
          sed -i 's|WhisperLargeV3Turbo|WhisperLargeV3|g' *.py
          sed -i 's|whisper_large_v3_turbo|whisper_large_v3|g' *.py info.yaml
          sed -i 's|whisper-large-v3-turbo|whisper-large-v3|g' *.py info.yaml
          sed -i 's|Whisper Large V3 Turbo|Whisper Large V3|g' model.py info.yaml
          sed -i 's|Whisper-Large-V3-Turbo|Whisper-Large-V3|g' info.yaml
          grep -n 'WHISPER_VERSION' model.py
          ! grep -rn "Turbo\|turbo" *.py | grep -v README || true
          python -c "import importlib; m = importlib.import_module('qai_hub_models.models.whisper_large_v3'); print('注册成功:', m.Model)"

      # ================= float 路径: 一条命令出 EPContext =================
      - name: 导出 ONNX + AI Hub 云编译为 EPContext (float 路径)
        if: ${{ !inputs.list_devices && inputs.precision == 'float' }}
        run: |
          python -m "qai_hub_models.models.${{ inputs.model_id }}.export" \
            --target-runtime precompiled_qnn_onnx \
            --device "${{ inputs.device }}"

      # ================= w8a16 路径: 全云端量化 =================
      - name: 导出 float ONNX (w8a16 第 1 步, 只导出不编译)
        if: ${{ !inputs.list_devices && inputs.precision == 'w8a16' }}
        run: |
          python -m "qai_hub_models.models.${{ inputs.model_id }}.export" \
            --target-runtime onnx \
            --device "${{ inputs.device }}"
          find export_assets -name "*.onnx" | head

      - name: 真实语音校准 + 云端量化 + 云端编译 (w8a16 第 2 步, 耗时)
        if: ${{ !inputs.list_devices && inputs.precision == 'w8a16' }}
        env:
          QAI_DEVICE: ${{ inputs.device }}
          ENC_CALIB: "150"   # encoder 校准样本数 (真实 mel)
          DEC_CALIB: "12"    # decoder 校准样本数 (要跑 encoder 推理, 别贪多)
        run: |
          cat > /tmp/hub_quantize_compile.py <<'PYEOF'
          import glob, os, sys
          import numpy as np
          import onnxruntime as ort
          import qai_hub as hub

          DEVICE = os.environ["QAI_DEVICE"]
          ENC_N = int(os.environ.get("ENC_CALIB", "150"))
          DEC_N = int(os.environ.get("DEC_CALIB", "12"))
          PAST = 8          # decoder 校准时的模拟 past 长度
          TQ = 3            # 每次喂给 decoder 的 token 数 (与 3-token prompt 对齐)

          # ---------- 1. 定位导出的 encoder / decoder onnx ----------
          enc_path = dec_path = None
          for p in sorted(glob.glob("export_assets/**/*.onnx", recursive=True)):
              names = [i.name for i in ort.InferenceSession(p, providers=["CPUExecutionProvider"]).get_inputs()]
              if "input_features" in names:
                  enc_path = p
              else:
                  dec_path = p
              del names
          assert enc_path and dec_path, f"onnx 定位失败: enc={enc_path} dec={dec_path}"
          print(f"encoder: {enc_path}\ndecoder: {dec_path}")

          # ---------- 2. 真实语音 -> log-mel (LibriSpeech test-clean, 流式下载) ----------
          from transformers import WhisperFeatureExtractor
          from datasets import load_dataset
          fe = WhisperFeatureExtractor.from_pretrained("openai/whisper-large-v3")
          ds = load_dataset("librispeech_asr", "clean", split="test",
                            streaming=True, trust_remote_code=True)
          mels = []
          for ex in ds:
              f = fe(ex["audio"]["array"], sampling_rate=ex["audio"]["sampling_rate"],
                     return_tensors="np").input_features[0]
              mels.append(f.astype(np.float32))
              if len(mels) >= ENC_N:
                  break
          print(f"mel 校准样本: {len(mels)} 条, shape {mels[0].shape}")

          # ---------- 3. encoder 校准数据 ----------
          enc_sess = ort.InferenceSession(enc_path, providers=["CPUExecutionProvider"])
          enc_out_names = [o.name for o in enc_sess.get_outputs()]
          enc_calib = {"input_features": [m[None] for m in mels]}

          # ---------- 4. decoder 校准数据 ----------
          # 用真实 mel 过一遍 encoder 拿 cross cache; self cache / mask / ids 用
          # 形状合法的模拟值 —— AIMET min-max 只需要覆盖激活数值范围, 不要求
          # 语义正确的解码序列。
          dec_sess = ort.InferenceSession(dec_path, providers=["CPUExecutionProvider"])
          dec_inputs = dec_sess.get_inputs()
          dec_calib = {i.name: [] for i in dec_inputs}
          cross_in_names = sorted([n for n in dec_calib if "cross" in n])
          cross_out = {n: enc_out_names[i] for i, n in enumerate(cross_in_names)} \
                      if not set(cross_in_names) <= set(enc_out_names) else \
                      {n: n for n in cross_in_names}

          for si, m in enumerate(mels[:DEC_N]):
              print(f"decoder 校准样本 {si+1}/{DEC_N}: 跑 encoder ...")
              outs = enc_sess.run(enc_out_names, {"input_features": m[None]})
              enc_map = dict(zip(enc_out_names, outs))
              sample = {}
              for inp in dec_inputs:
                  n = inp.name
                  dims = [d if isinstance(d, int) else None for d in inp.shape]
                  if "cross" in n:
                      sample[n] = np.ascontiguousarray(enc_map[cross_out[n]], dtype=np.float32)
                  elif "self" in n:
                      shape = [1 if d is None else d for d in dims]
                      if len(shape) == 4:
                          shape[2] = PAST
                      sample[n] = (np.random.randn(*shape) * 0.5).astype(np.float32)
                  elif n == "input_ids":
                      sample[n] = np.array([[50258, 50259, 50359][:TQ]], dtype=np.int64)
                  elif "attention_mask" in n:
                      width = dims[-1] if dims[-1] else PAST + TQ
                      sample[n] = np.ones([1 if d is None else d for d in dims[:-1]] + [width],
                                          dtype=np.int64)
                  elif "position" in n:
                      shape = [1 if d is None else d for d in dims]
                      sample[n] = np.full(shape, PAST + TQ - 1, dtype=np.int64)
                  else:
                      shape = [1 if d is None else d for d in dims]
                      sample[n] = np.zeros(shape, dtype=np.float32)
              for k, v in sample.items():
                  dec_calib[k].append(v)
          print("decoder 校准数据构造完成")

          # ---------- 5. 云端量化 (AIMET 在高通服务器上跑) ----------
          def quantize_and_compile(onnx_path, calib, tag):
              print(f"[{tag}] 上传 float onnx ...")
              model = hub.upload_model(onnx_path)
              print(f"[{tag}] 提交量化任务 (w8a16: INT8 权重 + INT16 激活) ...")
              qjob = hub.submit_quantize_job(
                  model, calib,
                  weights_dtype=hub.QuantizeDtype.INT8,
                  activations_dtype=hub.QuantizeDtype.INT16)
              qmodel = qjob.get_target_model()
              print(f"[{tag}] 提交编译任务 (precompiled_qnn_onnx) ...")
              cjob = hub.submit_compile_job(
                  qmodel, device=hub.get_device(DEVICE),
                  options="--target_runtime precompiled_qnn_onnx")
              compiled = cjob.get_target_model()
              out = f"export_assets/{tag}_w8a16_precompiled_qnn_onnx.onnx"
              compiled.download(out)
              print(f"[{tag}] 完成 -> {out}")

          quantize_and_compile(enc_path, enc_calib, "encoder")
          quantize_and_compile(dec_path, dec_calib, "decoder")
          print("全部完成")
          PYEOF
          python /tmp/hub_quantize_compile.py

      - name: 打包产物 (按 1.8GB 分卷, 绕过单 artifact 2GB 限制)
        if: ${{ !inputs.list_devices }}
        run: |
          find export_assets -maxdepth 3 -type f | head -50
          SUFFIX=""
          if [ "${{ inputs.precision }}" = "w8a16" ]; then SUFFIX="_quantized"; fi
          cd export_assets
          zip -0 -r -s 1800m "../${{ inputs.model_id }}${SUFFIX}_precompiled_qnn_onnx.zip" .
          cd ..
          ls -la *.zip*

      - name: 上传编译产物
        if: ${{ !inputs.list_devices }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.model_id }}${{ inputs.precision == 'w8a16' && '-quantized' || '' }}-precompiled-qnn-onnx
          path: ${{ inputs.model_id }}*_precompiled_qnn_onnx.zip*
          compression-level: 0
          retention-days: 7
