# ============================================================================
# whisper large-v3 (完整版) -> QNN EPContext 自动转换 (目标: SM8850 / Hexagon v81)
#
# 原理: 官方 qai_hub_models 库里没有 large-v3 完整版, 但 whisper 家族的导出
#  配方是共享的 (层数/头数/维度全部从 HF config 动态读取)。本 workflow 在云
#  runner 上复制 turbo 的配方、把型号改成 openai/whisper-large-v3 完成注册,
#  然后走 AI Hub 云编译, 产物和你现在用的 turbo 预编译包格式完全一致
#  (precompiled_qnn_onnx = EPContext), v9 驱动换 -m 路径直接用。
#
# 使用前提 (一次性准备):
#   1. 去 https://aihub.qualcomm.com 注册账号, 在 Settings -> API 拿 API Token
#   2. 把本文件放到仓库 .github/workflows/ 下
#   3. 仓库 Settings -> Secrets and variables -> Actions -> New repository secret:
#        Name:   QAI_HUB_API_TOKEN
#        Secret: 你的 token
#   4. Actions 页签手动 Run workflow:
#        - 第一次先把 list_devices 打勾跑一遍, 在日志里找 SM8850 对应的设备名
#          (找带 "8 Elite Gen 5" / "Galaxy S26" / "Redmi K90" / "OnePlus 15"
#           字样的), 然后把它填到 device 输入框正式跑
#
# 产物: Artifacts 里下载 xxx.zip / xxx.z01 ... 全部分卷后:
#        7z x xxx.zip        (7z 自动连读分卷)
#   解压后目录结构和你现在的 turbo 包一样, 手机上:
#        ./whisper_qnn xxx.wav -m <解压目录> -t <tokens.txt> --vad ... -o out.srt
#   tokens.txt 继续用 sherpa-onnx whisper-medium 那份 (v2/v3 文本 token 一致)
#
# 预期: float 路径全程约 30~90 分钟, 产物 ~3.1GB fp16;
#       w8a16 路径多了"真实语音校准数据生成"步骤 (runner 上跑十几次 encoder
#       推理), 全程约 2~4 小时, 产物 ~1.55GB
#
# w8a16 量化版 (precision 选 w8a16) —— 全云端量化, runner 不跑 AIMET:
#   直接调用官方集合导出管线 (绕过 CLI 白名单), 流程全部在高通服务器:
#   上传 TorchScript -> 云端转 ONNX -> 云端量化 (w8a16 = INT8 权重 +
#   INT16 激活) -> 云端编译 EPContext。runner 内存占用 < 2GB, 无 OOM 风险。
#   校准数据: 猴子补丁官方校准函数, encoder 用真实 LibriSpeech 语音
#   算出的 log-mel (150 条), decoder 用与 input_spec 精确对齐的合成数据。
#   注意: qai_hub 的 Python API 偶尔改版, 若脚本报属性/参数名错误, 把日志
#         发我, 一般改一行就能适配。
# ============================================================================

name: Convert Whisper to QNN EPContext

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: >-
          模型 ID: whisper_large_v3 = 自注册的完整版; 也可直接填官方库型号
          (whisper_medium / whisper_small / whisper_base / whisper_tiny / whisper_large_v3_turbo)
        default: "whisper_large_v3"
        required: true
      device:
        description: >-
          AI Hub 目标设备名 (决定 Hexagon 架构; SM8850 选 8 Elite Gen 5 系列设备)。
          不确定就先勾选 list_devices 跑一遍查名字
        default: "Samsung Galaxy S26 (Family)"
        required: true
      precision:
        description: >-
          精度: float = fp16 (~3.1GB, 质量好); w8a16 = int8 权重量化 (~1.55GB,
          快约 1.3~1.8x, 全云端量化 + 真实语音校准, 仅支持 whisper_large_v3)
        type: choice
        options:
          - float
          - w8a16
        default: float
      list_devices:
        description: "只列出 AI Hub 可用设备名然后退出 (辅助模式)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 清理磁盘 (large-v3 中间产物很大)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/lib/jvm || true
          docker system prune -af 2>/dev/null || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖 (CPU 版 torch/torchvision, 避免下载 2GB+ CUDA 包; 钉死版本防漂移)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "qai-hub-models==0.58.0" "transformers==4.56.2"
          # 新版 whisper 配方的 __init__ 会连带 import 演示 app (依赖 sounddevice)
          sudo apt-get update -qq && sudo apt-get install -y -qq libportaudio2
          pip install sounddevice
          # 诊断: 确认实际安装版本 (脚本是按 0.58.0 源码核对的)
          python -c "from importlib.metadata import version; print('qai-hub-models', version('qai-hub-models'), '| qai-hub', version('qai-hub'))"
          python -c "from qai_hub_models.utils.export.dispatch import resolve_export_model; print('export.dispatch OK')"

      - name: 安装 w8a16 额外依赖 (真实语音校准数据生成用)
        if: ${{ !inputs.list_devices && inputs.precision == 'w8a16' }}
        run: |
          pip install soundfile

      - name: 检查 w8a16 支持的模型
        if: ${{ !inputs.list_devices && inputs.precision == 'w8a16' }}
        run: |
          if [ "${{ inputs.model_id }}" != "whisper_large_v3" ]; then
            echo "::error::w8a16 云端量化路径目前只写了 whisper_large_v3 (自注册); 其他型号请用 float 精度"
            exit 1
          fi

      - name: 配置 AI Hub API token
        run: |
          qai-hub configure --api_token "${{ secrets.QAI_HUB_API_TOKEN }}" || {
            mkdir -p ~/.qai_hub
            printf '[default]\napi_token=%s\n' "${{ secrets.QAI_HUB_API_TOKEN }}" > ~/.qai_hub/client.ini
          }

      - name: 列出 AI Hub 可用设备 (辅助模式)
        if: inputs.list_devices
        run: qai-hub list-devices

      - name: 注册 whisper_large_v3 变体 (复制 turbo 配方, 改 HF 型号)
        if: ${{ !inputs.list_devices && inputs.model_id == 'whisper_large_v3' }}
        run: |
          set -e
          MODELS_DIR=$(python -c "import pathlib, qai_hub_models; print(pathlib.Path(qai_hub_models.__file__).parent / 'models')")
          echo "qai_hub_models 模型目录: $MODELS_DIR"
          cp -r "$MODELS_DIR/whisper_large_v3_turbo" "$MODELS_DIR/whisper_large_v3"
          cd "$MODELS_DIR/whisper_large_v3"
          sed -i 's|openai/whisper-large-v3-turbo|openai/whisper-large-v3|g' model.py
          sed -i 's|WhisperLargeV3Turbo|WhisperLargeV3|g' *.py
          sed -i 's|whisper_large_v3_turbo|whisper_large_v3|g' *.py info.yaml
          sed -i 's|whisper-large-v3-turbo|whisper-large-v3|g' *.py info.yaml
          sed -i 's|Whisper Large V3 Turbo|Whisper Large V3|g' model.py info.yaml
          sed -i 's|Whisper-Large-V3-Turbo|Whisper-Large-V3|g' info.yaml
          # info.yaml 校验: published 状态必须有官方 release-assets.yaml, 自注册
          # 变体没有, 改为 unpublished (校验器仅要求 status_reason 非空)
          sed -i 's|^status: published|status: unpublished|' info.yaml
          echo 'status_reason: "CI-registered custom variant, not an official release."' >> info.yaml
          grep -n 'WHISPER_VERSION' model.py
          ! grep -rn "Turbo\|turbo" *.py | grep -v README || true
          python -c "import importlib; m = importlib.import_module('qai_hub_models.models.whisper_large_v3'); print('注册成功:', m.Model)"

      # ================= float 路径: 一条命令出 EPContext =================
      - name: 导出 ONNX + AI Hub 云编译为 EPContext (float 路径)
        if: ${{ !inputs.list_devices && inputs.precision == 'float' }}
        run: |
          python -m "qai_hub_models.models.${{ inputs.model_id }}.export" \
            --target-runtime precompiled_qnn_onnx \
            --device "${{ inputs.device }}"

      # ================= w8a16 路径: 全云端量化 =================
      # 直接调官方集合导出管线 (绕过 CLI 的 runtime 白名单):
      #   上传 TorchScript -> 云端转 ONNX -> 云端量化 -> 云端编译 EPContext
      # 并猴子补丁校准数据函数: encoder 校准用真实 LibriSpeech mel,
      # decoder 校准用与 input_spec 精确对齐的合成数据。
      - name: 真实语音校准 + 云端量化 + 云端编译 (w8a16, 耗时步骤)
        if: ${{ !inputs.list_devices && inputs.precision == 'w8a16' }}
        env:
          QAI_DEVICE: ${{ inputs.device }}
          ENC_CALIB: "150"   # encoder 校准样本数 (真实 mel)
          DEC_CALIB: "64"    # decoder 校准样本数 (合成数据, 很便宜)
        run: |
          cat > /tmp/hub_quantize_export.py <<'PYEOF'
          import os
          import numpy as np
          import qai_hub as hub
          from qai_hub_models import Precision, TargetRuntime
          from qai_hub_models.utils import quantization as quantization_utils
          from qai_hub_models.utils.export.dispatch import resolve_export_model
          from qai_hub_models.utils.qai_hub_helpers import make_hub_dataset_entries

          DEVICE = os.environ["QAI_DEVICE"]
          MODEL_ID = "whisper_large_v3"
          ENC_N = int(os.environ.get("ENC_CALIB", "150"))
          DEC_N = int(os.environ.get("DEC_CALIB", "64"))

          # ---------- 1. 真实语音 -> log-mel (LibriSpeech test-clean, 流式) ----------
          import io
          import soundfile as sf
          from transformers import WhisperFeatureExtractor
          from datasets import load_dataset, Audio
          fe = WhisperFeatureExtractor.from_pretrained("openai/whisper-large-v3")
          # decode=False: 不让 datasets 用 torchcodec 解码, 拿原始 flac 字节
          # 用 soundfile 自己解 (LibriSpeech 是 16kHz 单声道 flac, 无需重采样)
          ds = load_dataset("librispeech_asr", "clean", split="test",
                            streaming=True, trust_remote_code=True)
          ds = ds.cast_column("audio", Audio(decode=False))
          mels = []
          for ex in ds:
              audio, sr = sf.read(io.BytesIO(ex["audio"]["bytes"]), dtype="float32")
              if audio.ndim > 1:
                  audio = audio.mean(axis=1)
              f = fe(audio, sampling_rate=sr, return_tensors="np").input_features[0]
              mels.append(f.astype(np.float32))
              if len(mels) >= ENC_N:
                  break
          print(f"mel 校准样本: {len(mels)} 条, shape {mels[0].shape}")

          # ---------- 2. 猴子补丁: 用真实 mel 替换官方校准数据 ----------
          orig_get_calib = quantization_utils.get_calibration_data

          def patched(model, input_spec_arg=None, num_samples=None,
                      component_name=None, dataset_options=None, app=None):
              if component_name is None or not isinstance(input_spec_arg, dict):
                  return orig_get_calib(model, input_spec_arg, num_samples,
                                        component_name, dataset_options, app)
              spec = input_spec_arg[component_name]
              if "input_features" in spec:
                  print(f"[calib] {component_name}: 真实语音 mel x{len(mels)}")
                  return make_hub_dataset_entries((mels,), ["input_features"])
              # decoder: 形状/类型与 input_spec 精确对齐的合成校准数据
              print(f"[calib] {component_name}: 合成校准 x{DEC_N} (input_spec 对齐)")
              names = list(spec.keys())
              data = {n: [] for n in names}
              rng = np.random.default_rng(0)
              for _ in range(DEC_N):
                  for n in names:
                      shape = tuple(spec[n].shape)
                      dt = np.dtype(spec[n].dtype)
                      if n == "input_ids":
                          data[n].append(np.array([[50258]], dtype=dt))  # <|startoftranscript|>
                      elif "position" in n:
                          data[n].append(np.zeros(shape, dtype=dt))
                      elif "attention_mask" in n:
                          data[n].append(np.zeros(shape, dtype=dt))
                      else:  # kv caches
                          data[n].append((rng.standard_normal(shape) * 0.5).astype(dt))
              return make_hub_dataset_entries(tuple(data[n] for n in names), names)

          quantization_utils.get_calibration_data = patched

          # ---------- 3. 调官方管线: 量化+编译全部在 AI Hub 云端完成 ----------
          export_model = resolve_export_model(MODEL_ID)
          device = hub.Device(name=DEVICE, attributes=[], os="")
          export_model(
              MODEL_ID,
              device=device,
              precision=Precision.w8a16,
              target_runtime=TargetRuntime.PRECOMPILED_QNN_ONNX,
              skip_profiling=True,
              skip_inferencing=True,
              output_dir="export_assets",
          )
          print("w8a16 云端量化+编译完成")
          PYEOF
          python /tmp/hub_quantize_export.py
          find export_assets -maxdepth 3 -type f | head -30

      - name: 打包产物 (按 1.8GB 分卷, 绕过单 artifact 2GB 限制)
        if: ${{ !inputs.list_devices }}
        run: |
          find export_assets -maxdepth 3 -type f | head -50
          SUFFIX=""
          if [ "${{ inputs.precision }}" = "w8a16" ]; then SUFFIX="_quantized"; fi
          cd export_assets
          zip -0 -r -s 1800m "../${{ inputs.model_id }}${SUFFIX}_precompiled_qnn_onnx.zip" .
          cd ..
          ls -la *.zip*

      - name: 上传编译产物
        if: ${{ !inputs.list_devices }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.model_id }}${{ inputs.precision == 'w8a16' && '-quantized' || '' }}-precompiled-qnn-onnx
          path: ${{ inputs.model_id }}*_precompiled_qnn_onnx.zip*
          compression-level: 0
          retention-days: 7
