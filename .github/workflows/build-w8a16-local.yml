# ============================================================================
# whisper large-v3 w8a16 —— 本地编译版 (云端只量化, 编译拿回 runner)
#
# 背景: AI Hub 云端编译 w8a16 large-v3 必撞 "Time limit exceeded in
#   compilation step" (OPTIMIZING_MODEL 阶段, 平台单 job 硬时限, O1/O2/O3/
#   2.45/2.47 全试过无解)。量化本身没问题, 产物存在高通服务器上。
#   本 workflow: 云端量化产物 -> 下载 -> runner 本地 QAIRT 2.48 编 v81
#   context bin。本地没有平台时限, encoder/decoder 拆两个并行 job,
#   每个独享 GitHub 6 小时上限。
#
# 使用前提:
#   1. 先跑过旧 workflow 的 w8a16 (submit_quantize 成功即可, build_quantize
#      失败无所谓), 从那步日志末尾抄 "量化任务已提交, ID: {...}" 里的两个
#      job ID; 量化结果在高通服务器上, 不会丢。
#   2. 仓库 secret QAI_HUB_API_TOKEN (和旧 workflow 共用)。
#   3. Run 本 workflow 时把两个 ID 填进输入框。
#
# 产物: Artifacts 里 encoder-context-bin / decoder-context-bin
#   里面是 xxx_qairt_context.bin, 和 float 包的 bin 同格式。
#   stub .onnx (EPContext 壳) 的生成下一步单独做 —— 需要参照 float 包
#   encoder.onnx 的属性结构复刻 (手机上 pip install onnx 读出来)。
# ============================================================================

name: Build w8a16 Context Bins Locally

on:
  workflow_dispatch:
    inputs:
      encoder_quant_job:
        description: "encoder 量化任务 ID (旧 workflow Job A 日志末尾抄)"
        required: true
      decoder_quant_job:
        description: "decoder 量化任务 ID (同上)"
        required: true
      qairt_version:
        description: "本地编译用 QAIRT 版本 (full version 前 13 位)"
        default: "2.48.0.260626"
        required: true

permissions:
  contents: read

env:
  UA: "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"

jobs:
  # ==========================================================================
  # Job 1: 轮询量化结果 + 下载量化 ONNX (几分钟, 必成)
  # ==========================================================================
  download_quantized:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装 qai-hub
        run: |
          python -m pip install --upgrade pip
          pip install "qai-hub-models==0.58.0"

      - name: 配置 AI Hub API token
        run: |
          qai-hub configure --api_token "${{ secrets.QAI_HUB_API_TOKEN }}" || {
            mkdir -p ~/.qai_hub
            printf '[default]\napi_token=%s\n' "${{ secrets.QAI_HUB_API_TOKEN }}" > ~/.qai_hub/client.ini
          }

      - name: 轮询量化结果 + 下载量化模型
        env:
          ENC_JID: ${{ inputs.encoder_quant_job }}
          DEC_JID: ${{ inputs.decoder_quant_job }}
        run: |
          mkdir -p quantized_onnx
          cat > /tmp/dl_quant.py <<'PYEOF'
          import os
          import qai_hub as hub

          def wait_and_download(jid, name):
              job = hub.get_job(jid)
              status = job.wait()
              code = getattr(status, "code", str(status))
              msg = getattr(status, "message", "")
              print(f"[{name}] 量化任务 {jid} 最终状态: {code} {msg}")
              if "SUCCESS" not in str(code).upper():
                  raise RuntimeError(f"{name} 量化失败: {code} {msg}")
              m = job.get_target_model()
              assert m is not None, f"{name} 量化未产出模型"
              path = m.download(f"quantized_onnx/{name}_quant.onnx")
              print(f"[{name}] 已下载 -> {path}")

          wait_and_download(os.environ["ENC_JID"], "encoder")
          wait_and_download(os.environ["DEC_JID"], "decoder")
          PYEOF
          python /tmp/dl_quant.py

      - name: 查看产物格式 (决定 converter 参数, 关键诊断)
        run: |
          ls -la quantized_onnx/
          for f in quantized_onnx/*; do
            echo "== $f"; file "$f"
          done
          # 如果是 zip 包 (AI Hub 有时打包 onnx+encodings), 先解开看
          for f in quantized_onnx/*.zip; do
            [ -e "$f" ] || continue
            d="${f%.zip}_x"; mkdir -p "$d"; unzip -o "$f" -d "$d"; ls -la "$d"
          done

      - name: 上传量化模型
        uses: actions/upload-artifact@v4
        with:
          name: quantized-onnx
          path: quantized_onnx/
          compression-level: 0
          retention-days: 7

  # ==========================================================================
  # Job 2: 本地 QAIRT 编译 v81 context bin (encoder/decoder 并行)
  # ==========================================================================
  compile_context:
    needs: download_quantized
    runs-on: ubuntu-latest
    timeout-minutes: 360          # GitHub 免费 job 硬上限 6 小时
    strategy:
      fail-fast: false
      matrix:
        component: [encoder, decoder]
    env:
      QAIRT_VER: ${{ inputs.qairt_version }}
    steps:
      - name: 清理磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/lib/jvm || true
          docker system prune -af 2>/dev/null || true
          df -h /

      - name: 下载量化模型
        uses: actions/download-artifact@v4
        with:
          name: quantized-onnx
          path: quantized_onnx

      - name: 下载 QAIRT SDK (带 UA, 已验证免登录直链)
        run: |
          wget -q --user-agent="$UA" \
            "https://softwarecenter.qualcomm.com/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/${QAIRT_VER}/v${QAIRT_VER}.zip" \
            -O qairt.zip
          ls -la qairt.zip && file qairt.zip
          unzip -q qairt.zip
          # zip 里是 qairt/<ver>/ 目录结构
          export QAIRT_ROOT="$PWD/qairt/${QAIRT_VER}"
          echo "QAIRT_ROOT=$QAIRT_ROOT" >> $GITHUB_ENV
          ls "$QAIRT_ROOT/bin/x86_64-linux-clang" | head -20
          ls "$QAIRT_ROOT/lib/x86_64-linux-clang" | grep -i htp

      - name: 安装 converter 的 Python 依赖 + 配置 QAIRT Python 环境
        run: |
          # libc++1/libc++abi1: qti 转换器的原生模块 (libPyIrGraph312) 是
          # clang 体系编的, 需要 LLVM libc++ 运行时, Ubuntu 默认不带
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip libc++1 libc++abi1
          # QAIRT 2.48 官方 check-python-dependency 的完整依赖清单
          # (从 SDK 包内脚本原样扒出, 版本全部钉死, 一次装齐)
          pip install \
            safetensors==0.4.3 absl-py==2.1.0 aenum==3.1.15 attrs==23.2.0 \
            dash==2.12.1 decorator==4.4.2 invoke==1.7.3 joblib==1.4.0 \
            jsonschema==4.19.0 lxml==5.2.1 mako==1.2.0 matplotlib==3.10.8 \
            mock==3.0.5 numpy==1.26.4 opencv-python==4.8.1.78 optuna==3.3.0 \
            packaging==24.0 pandas==2.3.3 paramiko==3.5.1 pathlib2==2.3.6 \
            pillow==10.2.0 plotly==5.20.0 psutil==6.1.1 pydantic==2.8.2 \
            pyyaml==6.0.3 rich==13.9.4 scikit-optimize==0.9.0 scipy==1.15.3 \
            six==1.16.0 tabulate==0.9.0 typing-extensions==4.14.0 \
            xlsxwriter==1.2.2 \
            onnx protobuf
          # QAIRT 的 python 包 (qti.aisw.converters) 在 SDK 的 lib/python 下
          export PYTHONPATH="$QAIRT_ROOT/lib/python:$PYTHONPATH"
          echo "PYTHONPATH=$QAIRT_ROOT/lib/python:\$PYTHONPATH" >> $GITHUB_ENV
          # 诊断: 确认 qti 模块可导入
          PYTHONPATH="$QAIRT_ROOT/lib/python" python3 -c \
            "from qti.aisw.converters import onnx as f; print('qti converters OK')"

      - name: QDQ ONNX -> QNN 模型库
        run: |
          set -e
          export QAIRT_SDK_ROOT="$QAIRT_ROOT"
          export LD_LIBRARY_PATH="$QAIRT_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH"
          export PATH="$QAIRT_ROOT/bin/x86_64-linux-clang:$PATH"
          # 量化产物可能是 zip 包, 先全部解开再找 onnx
          find quantized_onnx -name "*.zip" -exec sh -c 'unzip -o "$1" -d "${1%.zip}_x"' _ {} \;
          ls -laR quantized_onnx | head -40
          ONNX=$(find quantized_onnx -name "*.onnx" | grep -i "${{ matrix.component }}" | head -1)
          [ -n "$ONNX" ] || { echo "::error::找不到 ${{ matrix.component }} 的 onnx"; exit 1; }
          echo "量化 ONNX: $ONNX"
          # QDQ (QuantizeLinear/DequantizeLinear 内嵌) 直接转, 量化参数随图走
          qnn-onnx-converter --input_model "$ONNX" \
            --output_path ${{ matrix.component }}.cpp
          qnn-model-lib-generator \
            -c ${{ matrix.component }}.cpp \
            -b ${{ matrix.component }}.bin \
            -t x86_64-linux-clang \
            -o model_libs
          ls -la model_libs/x86_64-linux-clang/

      - name: 生成 HTP v81 context binary (重活, 本地无平台时限)
        run: |
          set -e
          export LD_LIBRARY_PATH="$QAIRT_ROOT/lib/x86_64-linux-clang:$LD_LIBRARY_PATH"
          export PATH="$QAIRT_ROOT/bin/x86_64-linux-clang:$PATH"
          # HTP 后端扩展配置: 指定 dsp_arch v81 (SM8850)
          cat > htp_backend_config.json <<'EOF'
          {
            "devices": [ { "device_id": 0, "dsp_arch": "v81", "pd_session": "unsigned" } ],
            "graphs": [ { "vtcm_mb": 8, "hvx_threads": 8 } ]
          }
          EOF
          python3 -c "import json; json.load(open('htp_backend_config.json'))"  # 去缩进校验
          cat > sdk_config.json <<EOF
          {
            "backend_extensions": {
              "shared_library_path": "$QAIRT_ROOT/lib/x86_64-linux-clang/libQnnHtpNetRunExtensions.so",
              "config_file_path": "$PWD/htp_backend_config.json"
            }
          }
          EOF
          qnn-context-binary-generator \
            --model model_libs/x86_64-linux-clang/lib${{ matrix.component }}.so \
            --backend "$QAIRT_ROOT/lib/x86_64-linux-clang/libQnnHtp.so" \
            --binary_file ${{ matrix.component }}_qairt_context.bin \
            --config_file sdk_config.json \
            --output_dir context_out
          ls -la context_out/

      - name: 上传 context bin
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-context-bin
          path: context_out/
          compression-level: 0
          retention-days: 7
