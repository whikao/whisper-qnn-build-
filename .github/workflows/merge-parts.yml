# ============================================================================
# 合并 4 个已编译的 part (跳过编译, 直接从 AI Hub 下载产物合并)
#
# 背景: cloud-compile-parts 跑完了 4 个分片的云端编译 (全部 SUCCESS),
#   但解压步骤因文件名 bug 退出, 合并没执行。本 workflow 只做:
#   按 4 个分片编译任务 ID 下载产物 -> 合并成四分区 EPContext。
#
# 输入: p1~p4 的分片编译任务 ID (在上次运行日志 "partX 已提交: j..." 里,
#       或 AI Hub 网页 jobs 列表找名字 w8a16-encoder-p1-o3 之类的)
# ============================================================================

name: Merge 4 compiled parts

on:
  workflow_dispatch:
    inputs:
      p1_job:
        description: "part1 编译任务 ID"
        required: true
      p2_job:
        description: "part2 编译任务 ID"
        required: true
      p3_job:
        description: "part3 编译任务 ID"
        required: true
      p4_job:
        description: "part4 编译任务 ID"
        required: true
      component:
        description: "部件名 encoder/decoder"
        required: true
        default: encoder

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "qai-hub" onnx

      - name: 配置 AI Hub API token
        run: |
          qai-hub configure --api_token "${{ secrets.QAI_HUB_API_TOKEN }}" || {
            mkdir -p ~/.qai_hub
            printf '[default]\napi_token=%s\n' "${{ secrets.QAI_HUB_API_TOKEN }}" > ~/.qai_hub/client.ini
          }

      - name: 下载 4 个分片编译产物并解压 (python zipfile, 不挑文件名)
        env:
          COMP: ${{ inputs.component }}
        run: |
          python - <<'PYEOF'
          import os, glob, zipfile, qai_hub as hub

          jids = ["${{ inputs.p1_job }}", "${{ inputs.p2_job }}",
                  "${{ inputs.p3_job }}", "${{ inputs.p4_job }}"]
          os.makedirs("ctx", exist_ok=True)

          for i, jid in enumerate(jids, 1):
              job = hub.get_job(jid)
              st = job.wait()
              print(f"part{i} ({jid}) 状态: {st}")
              tm = job.get_target_model()
              assert tm, f"part{i} 没有产物"
              dst = f"ctx/part{i}.zip"
              tm.download(dst)
              # 文件名可能被 SDK 改, 找实际下载的
              cand = sorted(glob.glob(f"ctx/part{i}.zip*"), key=os.path.getmtime)
              real = cand[-1]
              print(f"  下载为: {real}")
              outdir = f"ctx/p{i}"
              os.makedirs(outdir, exist_ok=True)
              with zipfile.ZipFile(real) as z:
                  z.extractall(outdir)
              for f in glob.glob(os.path.join(outdir, "**", "*"), recursive=True):
                  if os.path.isfile(f):
                      print(f"  {f}  {os.path.getsize(f)/1e6:.2f}MB")
          PYEOF

      - name: 合并成四分区 EPContext 模型
        env:
          COMP: ${{ inputs.component }}
        run: |
          python - <<'PYEOF'
          import os, glob, shutil, onnx
          from onnx import helper

          comp = os.environ["COMP"]
          os.makedirs("final", exist_ok=True)

          # ---- 阶段1: 加载全部 stub, 改 bin 引用和节点名 ----
          stubs = []
          for i in range(1, 5):
              d = f"ctx/p{i}"
              stub = glob.glob(os.path.join(d, "**", "*.onnx"), recursive=True)
              bins = glob.glob(os.path.join(d, "**", "*.bin"), recursive=True)
              assert stub and bins, f"part{i} 产物不齐: {stub} {bins}"
              stub, binf = stub[0], bins[0]

              new_bin = f"{comp}_p{i}.bin"
              shutil.copy(binf, f"final/{new_bin}")
              m = onnx.load(stub)
              old_bin = os.path.basename(binf)
              for node in m.graph.node:
                  node.name = f"{node.name or 'QNNContext'}_p{i}"
                  for attr in node.attribute:
                      if attr.type == attr.STRING:
                          v = attr.s.decode("utf-8", errors="ignore")
                          if old_bin in v or v.endswith(".bin"):
                              attr.s = new_bin.encode()
              print(f"part{i}: 节点数 {len(m.graph.node)}, 类型 {[n.op_type for n in m.graph.node][:8]}")
              for nd in m.graph.node:
                  print(f"part{i}:   节点输入 {list(nd.input)}")
                  print(f"part{i}:   节点输出 {list(nd.output)}")
              gi = [vi.name for vi in m.graph.input if vi.name not in {t.name for t in m.graph.initializer}]
              print(f"part{i}:   图输入 {gi}")
              print(f"part{i}:   图输出 {[vi.name for vi in m.graph.output]}")
              stubs.append(m)

          # ---- 阶段2: 串联主流 ----
          # stub 的 graph 输出是通用名 (output_0), 而下一片的输入是真实切面名;
          # 把第 i 片的主流输出改名为第 i+1 片的切面输入名, 链条才能接上
          def real_inputs(m):
            init_ns = {t.name for t in m.graph.initializer}
            return [vi for vi in m.graph.input if vi.name not in init_ns]

          graph_ins = real_inputs(stubs[0])
          orig_in_names = {v.name for v in graph_ins}

          cuts = []   # cuts[i] = part(i+2) 的切面输入 ValueInfo (连接 part i+1 -> i+2)
          for i in range(1, 4):
              cs = [vi for vi in real_inputs(stubs[i]) if vi.name not in orig_in_names]
              assert len(cs) == 1, f"part{i+1} 切面输入不是 1 个: {[c.name for c in cs]}"
              cuts.append(cs[0])
          print(f"切面张量: {[c.name for c in cuts]}")

          nodes_all = []
          graph_outs = []
          vis = {}
          for i, m in enumerate(stubs, 1):
              # 该 part 的"主流输出" = 名字在多片输出中重复出现(通用名)的那个
              out_name_cnt = {}
              for mm in stubs:
                  for vi in mm.graph.output:
                      out_name_cnt[vi.name] = out_name_cnt.get(vi.name, 0) + 1
              for vi in m.graph.output:
                  if i < 4 and out_name_cnt[vi.name] > 1:
                      old = vi.name
                      new = cuts[i - 1].name
                      vi.name = new                       # graph 输出改名
                      for nd in m.graph.node:             # 节点输出同步改名
                          for j, o in enumerate(nd.output):
                              if o == old: nd.output[j] = new
                      vis[new] = cuts[i - 1]              # 切面类型信息 (来自下一片输入)
                      print(f"part{i}: 主流输出 {old} -> {new}")
                  else:
                      graph_outs.append(vi)               # cache 输出/最终输出原样保留
              nodes_all.extend(m.graph.node)
              for vi in m.graph.value_info:
                  if vi.name not in {v.name for v in graph_outs} and vi.name not in vis:
                      vis[vi.name] = vi

          assert graph_ins and graph_outs, "首尾输入输出缺失"
          final_io = {v.name for v in graph_ins} | {v.name for v in graph_outs}
          vis = {k: v for k, v in vis.items() if k not in final_io}
          g = helper.make_graph(nodes_all, f"{comp}_w8a16_4parts",
                                graph_ins, graph_outs, initializer=[],
                                value_info=list(vis.values()))
          mdl = helper.make_model(g, opset_imports=[helper.make_opsetid("", 17),
                                                    helper.make_opsetid("com.microsoft", 1)])
          mdl.ir_version = 8
          onnx.save(mdl, f"final/{comp}_w8a16.onnx")
          print("合并完成:")
          for f in sorted(os.listdir("final")):
              print(" ", f, "%.1f MB" % (os.path.getsize(f"final/{f}")/1e6))
          PYEOF

      - name: "上传最终产物 (完整 stub + bins)"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component }}_w8a16_final
          path: final/
          retention-days: 14

      - name: 单独上传 stub (只有几 KB, bin 没变过时只下这个)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.component }}_w8a16_stub_only
          path: final/*.onnx
          retention-days: 14
